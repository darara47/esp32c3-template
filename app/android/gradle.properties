org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# Windows-only: this project lives on D:, but plugin sources resolve from
# pub cache on C: (nsd_android, flutter_esp_ble_prov, ...). Kotlin's
# incremental compiler tries to relativize paths across those roots and
# throws "this and base files have different roots" — disabling
# incremental compilation avoids that path computation entirely. Cross-
# platform builds (CI, other machines) aren't affected either way.
kotlin.incremental=false
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
